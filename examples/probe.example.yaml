# Copy to probe.yaml **outside this repository** and provide values through a local secrets.yaml.
# This outline is intentionally non-deployable until a reviewed release tag exists.
esphome:
  name: emerald-probe
  friendly_name: Emerald Energy Monitor

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/LeoRX/esphome-emerald
      ref: <REVIEWED-IMMUTABLE-RELEASE-TAG-OR-COMMIT>
      path: components
    components: [emerald_ble]

api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1
  power_save_mode: none
  ap:
    ssid: "Emerald Recovery"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: INFO

time:
  - platform: homeassistant
    id: homeassistant_time

esp32_ble_tracker:

ble_client:
  - mac_address: !secret emerald_mac
    id: emerald_advisor
    auto_connect: true
    on_passkey_request:
      - ble_client.passkey_reply:
          id: emerald_advisor
          passkey: !secret emerald_pairing_code

# The native Emerald component will expose only measured power and battery state.
sensor:
  - platform: emerald_ble
    ble_client_id: emerald_advisor
    power:
      name: "Emerald Power"
      id: emerald_power
    battery_level:
      name: "Emerald Battery"
    pulses_per_kwh: 1000

  - platform: uptime
    name: "Emerald Probe Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Emerald Probe Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Emerald Probe IP"
      entity_category: diagnostic
  - platform: version
    name: "Emerald Probe ESPHome Version"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Emerald Probe Status"
    device_class: connectivity
